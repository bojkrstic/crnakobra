services:
  content-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crnakobra}
      POSTGRES_USER: ${POSTGRES_USER:-crnakobra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in content-app/.env}
    volumes:
      - ./content-app/postgres-data:/var/lib/postgresql/data
      - ./content-app/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  content-app:
    build:
      context: ./content-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crnakobra}:${POSTGRES_PASSWORD}@content-db:5432/${POSTGRES_DB:-crnakobra}?sslmode=disable
      LISTEN_ADDR: :8090
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in content-app/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in content-app/.env}
    depends_on:
      content-db:
        condition: service_healthy
    ports:
      # Privremeno je dostupan samo na računaru/serveru. Nginx povezivanje dolazi kasnije.
      - "127.0.0.1:8090:8090"
    volumes:
      - ./content-app/uploads:/app/uploads
    restart: unless-stopped
