# Postaviti u /etc/nginx/sites-available/demo.crnakobra.com i uključiti u Nginx.
# Pre aktiviranja zameniti root putanju i obezbediti TLS sertifikat za demo.crnakobra.com.
server {
    listen 443 ssl http2;
    server_name demo.crnakobra.com;

    root /home/krle/html/crnakobra;
    index demo-portal.html;

    # Demo ne sme biti javno dostupan.
    auth_basic "Crna Kobra demo";
    auth_basic_user_file /etc/nginx/.htpasswd-crnakobra-demo;

    location / {
        try_files $uri $uri/ /demo-portal.html;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /webhooks/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
